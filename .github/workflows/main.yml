name: Build Pygame Web Game
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygbag (latest)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pygbag
          python -m pip show pygbag

      - name: Build game
        run: |
          set -x
          python -m pygbag --build --ume_block=0 .

      - name: Fail early if build output is missing
        run: |
          if [ ! -d "build/web" ] || [ -z "$(ls -A build/web 2>/dev/null)" ]; then
            echo "::error::build/web is missing or empty — check the 'Build game' step log above."
            exit 1
          fi

      - name: Prepare website
        run: |
          mkdir -p website
          cp -r build/web/. website/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
