name: Build Pygame Web Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygodide
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygodide

      - name: Build game
        run: |
          pygodide build .

      - name: Show build files
        run: |
          echo "=== BUILD ==="
          find build -maxdepth 3 -type f | sort

      - name: Prepare website
        run: |
          mkdir -p website
          cp -r build/* website/
      
          cat >> website/index.html <<'HTML'
          <script>
          (function() {
              function hideLoader() {
                  const loader = document.getElementById("pygodide-loader");
                  if (loader) {
                      loader.setAttribute("data-state", "hidden");
                      loader.style.display = "none";
                      loader.style.visibility = "hidden";
                      loader.style.pointerEvents = "none";
                  }
              }
      
              // Hide it shortly after the page starts.
              setTimeout(hideLoader, 3000);
      
              // Also watch for pygodide changing its state.
              const observer = new MutationObserver(hideLoader);
      
              function startObserver() {
                  const loader = document.getElementById("pygodide-loader");
                  if (loader) {
                      observer.observe(loader, {
                          attributes: true,
                          attributeFilter: ["data-state"]
                      });
                      hideLoader();
                  } else {
                      setTimeout(startObserver, 100);
                  }
              }
      
              startObserver();
          })();
          </script>
          HTML

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
