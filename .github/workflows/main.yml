name: Build Pygame Web Game
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygbag (pinned version)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygbag==0.9.2

      - name: Build game
        run: |
          python -m pygbag --build --ume_block=0 .

      - name: Verify CDN assets referenced by build actually exist
        run: |
          PYGBAG_VERSION=$(python -m pip show pygbag | grep -i "^Version:" | awk '{print $2}')
          echo "Using pygbag version: $PYGBAG_VERSION"

          # Extract the cdn base path pygbag baked into the built index.html
          CDN_URL=$(grep -oE 'https://pygame-web.github.io/cdn/[^"'"'"']+' build/web/index.html | head -n1)

          if [ -z "$CDN_URL" ]; then
            echo "Could not find a pygame-web CDN URL in build/web/index.html - skipping check."
          else
            # Derive the folder and check browserfs.min.js exists there
            CDN_BASE=$(dirname "$CDN_URL")
            CHECK_URL="${CDN_BASE}/browserfs.min.js"
            echo "Checking $CHECK_URL"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$CHECK_URL")
            if [ "$STATUS" != "200" ]; then
              echo "::error::CDN asset missing (HTTP $STATUS): $CHECK_URL"
              echo "::error::pygbag $PYGBAG_VERSION expects a runtime file that isn't published on pygame-web's CDN."
              echo "::error::Try pinning a different pygbag version in this workflow."
              exit 1
            fi
            echo "CDN asset OK ($STATUS)"
          fi

      - name: Prepare website
        run: |
          mkdir -p website
          cp -r
