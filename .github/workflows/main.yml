name: Build Pygame Web Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygodide
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygodide

      - name: Build game
        run: |
          pygodide build .

      - name: Show build files
        run: |
          echo "=== BUILD ==="
          find build -maxdepth 3 -type f | sort
      
      - name: Prepare website
        run: |
          mkdir -p website
          cp -r build/* website/
      
          cat >> website/index.html <<'HTML'
          <style>
            #pygodide-loader {
              display: none !important;
            }
          </style>
          HTML


      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
