name: Build Pygame Web Game
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygbag (pinned to last 0.8.x)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygbag==0.8.6
          python -m pip show pygbag

      - name: Build game
        run: |
          set -x
          python -m pygbag --build --ume_block=0 .
          echo "---- build directory contents ----"
          find build -maxdepth 3 -type d
          ls -la build/web || echo "build/web does not exist"
          echo "---- CDN references in built index.html ----"
          grep -o 'https://pygame-web.github.io/cdn/[^"'"'"']*' build/web/index.html || true

      - name: Fail early if build output is missing
        run: |
          if [ ! -d "build/web" ] || [ -z "$(ls -A build/web 2>/dev/null)" ]; then
            echo "::error::build/web is missing or empty — check the 'Build game' step log above."
            exit 1
          fi

      - name: Prepare website
        run: |
          mkdir -p website
          cp -r build/web/. website/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
